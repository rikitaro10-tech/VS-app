.kb-root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;}
.kb-mono{font-family:ui-monospace,"SFMono-Regular","SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
.kb-btn{transition:background-color .15s ease,border-color .15s ease,transform .05s ease;cursor:pointer;}
.kb-btn:active{transform:translateY(1px);}
.kb-row{transition:background-color .12s ease;}
.kb-row:hover{background:#FAFBFA;}
.kb-in:focus{outline:none;border-color:${i.turf}!important;box-shadow:0 0 0 3px rgba(30,122,76,.15);}
*:focus-visible{outline:2px solid ${i.turf};outline-offset:2px;}
.kb-sheet{animation:kbup .2s ease;}
@keyframes kbup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.kb-fade{animation:kbfade .16s ease;}
@keyframes kbfade{from{opacity:0}to{opacity:1}}
.kb-scroll::-webkit-scrollbar{width:8px;height:8px}
.kb-scroll::-webkit-scrollbar-thumb{background:#D5DAD4;border-radius:4px}
.kb-hscroll{-webkit-overflow-scrolling:touch;scrollbar-width:none;}
